<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="100%" height="100%">
  <defs>
    <linearGradient id="orbGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="reachGradWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="glowWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Brand Symbol / Emblem -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="none" stroke="url(#glowWhite)" stroke-width="2.5" stroke-dasharray="140 30" stroke-linecap="round"/>
    <rect x="10" y="10" width="44" height="44" rx="14" fill="url(#orbGradWhite)" filter="url(#glowFilt)"/>
    <path d="M 22 36 A 14 14 0 0 1 42 36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M 26 41 A 8 8 0 0 1 38 41" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <circle cx="32" cy="25" r="4.5" fill="#fbbf24"/>
    <circle cx="32" cy="25" r="2" fill="#ffffff"/>
    <circle cx="48" cy="16" r="3" fill="#34d399"/>
  </g>

  <!-- Typography: OneReachAll -->
  <g transform="translate(85, 43)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" fill="#ffffff" letter-spacing="-0.5">One</text>
    <text x="64" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" fill="url(#reachGradWhite)" letter-spacing="-0.5">Reach</text>
    <text x="156" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">All</text>
    <circle cx="204" cy="-18" r="4" fill="#38bdf8"/>
    <path d="M 202 -18 L 203.5 -16.5 L 206 -19.5" fill="none" stroke="#0a1931" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sub-Brand Tagline: BY ZBAZAAR SOLUTIONS -->
  <g transform="translate(87, 62)">
    <rect x="-2" y="-10" width="195" height="15" rx="3" fill="rgba(255,255,255,0.08)"/>
    <text x="5" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#94a3b8" letter-spacing="1.8">BY ZBAZAAR SOLUTIONS</text>
  </g>
</svg>
