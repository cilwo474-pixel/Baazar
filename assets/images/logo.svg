<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="100%" height="100%">
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="reachGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Brand Symbol / Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Orbital Ring -->
    <circle cx="32" cy="32" r="30" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-dasharray="140 30" stroke-linecap="round"/>
    
    <!-- Dynamic Hex Shield Container -->
    <rect x="10" y="10" width="44" height="44" rx="14" fill="url(#orbGrad)" filter="url(#glow)"/>
    
    <!-- Connectivity Arcs / Signal Nodes -->
    <path d="M 22 36 A 14 14 0 0 1 42 36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M 26 41 A 8 8 0 0 1 38 41" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Central Pulse Core -->
    <circle cx="32" cy="25" r="4.5" fill="#f59e0b"/>
    <circle cx="32" cy="25" r="2" fill="#ffffff"/>
    
    <!-- Global Pulse Ping -->
    <circle cx="48" cy="16" r="3" fill="#10b981"/>
  </g>

  <!-- Typography: OneReachAll -->
  <g transform="translate(85, 43)">
    <!-- One -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" fill="#0a1931" letter-spacing="-0.5">One</text>
    
    <!-- Reach -->
    <text x="64" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" fill="url(#reachGrad)" letter-spacing="-0.5">Reach</text>
    
    <!-- All -->
    <text x="156" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" fill="#0a1931" letter-spacing="-0.5">All</text>
    
    <!-- Verified Badge Dot -->
    <circle cx="204" cy="-18" r="4" fill="#0284c7"/>
    <path d="M 202 -18 L 203.5 -16.5 L 206 -19.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sub-Brand Tagline: BY ZBAZAAR SOLUTIONS -->
  <g transform="translate(87, 62)">
    <rect x="-2" y="-10" width="195" height="15" rx="3" fill="#f1f5f9"/>
    <text x="5" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#475569" letter-spacing="1.8">BY ZBAZAAR SOLUTIONS</text>
  </g>
</svg>
